      selections:
      - quote: The four nearest neighbor Ce ions always relax outwards
        comment: Abstract, journal page 244704-1; PDF page 2. This record demonstrates exact source navigation.
        color: '#c37b24'
        darkColor: '#efb565'
        opacity: 0.15
