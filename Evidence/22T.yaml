      selections:
      - quote: The local lattice environment is distorted with longer Ce-O bond lengths as the negative (positive)
          charge gets reduced;
        comment: Native defects, PDF page 3. The immediately following rendered equations give 2.41 Å for the
          electron polaron versus 2.33 Å in perfect bulk. Vacancy-free HSE06 reference, 324-atom cell. Checked
